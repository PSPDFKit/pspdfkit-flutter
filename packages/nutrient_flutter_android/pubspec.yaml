name: nutrient_flutter_android
description: Android implementation of the nutrient_flutter plugin.
version: 1.2.0
homepage: https://nutrient.io/
repository: https://github.com/PSPDFKit/pspdfkit-flutter
issue_tracker: https://support.nutrient.io/hc/en-us/requests/new
documentation: https://nutrient.io/guides/flutter/

environment:
  # 3.3+ required for the extension-type bindings generated by jnigen 0.17 / jni 1.0.
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  nutrient_flutter_platform_interface: ^1.2.0
  jni: ^1.0.0
  # Provides androidApplicationContext / androidActivity, which moved out of
  # package:jni into package:jni_flutter in jni 1.0.
  jni_flutter: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  # NOTE: regenerating the bindings against a Kotlin 2.3+ SDK (e.g. the current
  # nightly) currently requires a patched jnigen — the released versions ship
  # kotlinx-metadata-jvm:0.9.0 which only reads Kotlin metadata <= 2.1. See the
  # "Regenerating bindings" notes in generate_bindings.sh and dart-lang/native
  # issues #3219 / #3269 / PR #3297. The committed bindings were generated with
  # jnigen main + kotlin-metadata-jvm:2.3.0.
  jnigen: ^0.16.0

flutter:
  plugin:
    # `implements: nutrient_flutter` is REQUIRED and load-bearing. It tells Flutter
    # to treat this package as THE platform implementation of nutrient_flutter and
    # suppress nutrient_flutter's own native module in apps that depend on both.
    # Dropping it makes BOTH native modules link, producing a duplicate
    # `FlutterAppCompatActivity` (Android D8 dex merge) / duplicate symbols (iOS
    # linker) in every app that depends on nutrient_flutter — see CI build #2892.
    # The cost: bindings apps must list this package as a DIRECT dependency. The
    # single-direct-dep UX needs the legacy native module decommissioned first;
    # see documentation/bindings-federation-cleanup.md.
    implements: nutrient_flutter
    platforms:
      android:
        package: com.nutrient.nutrient_flutter_android
        pluginClass: NutrientFlutterPlugin
        dartPluginClass: NutrientFlutterAndroid

# For local development until packages are published to pub.dev
dependency_overrides:
  nutrient_flutter_platform_interface:
    path: ../nutrient_flutter_platform_interface
