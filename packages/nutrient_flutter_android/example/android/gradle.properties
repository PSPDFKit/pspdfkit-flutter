org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# D8 needs a global-synthetics consumer to desugar the Java records in
# nutrient-*.aar; without it dexing fails with "Attempt to create a global
# synthetic for 'Record desugaring' without a global-synthetics consumer".
android.enableApiModelingAndGlobalSynthetics=true
